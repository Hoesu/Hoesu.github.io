name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6
        with:
          node-version: 24
          # Astro 캐시(node_modules/.astro) 끄기: ec.config.mjs(코드 블록 테마)를 바꿔도 캐시가
          # 예전 글 변환 결과를 써서 코드 블록 스타일이 깨질 수 있음. 빌드가 몇 초라 캐시가 필요 없음
          cache: false

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
